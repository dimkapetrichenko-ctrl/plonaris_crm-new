<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYER PRO | B2B CRM System</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* М'який комфортний фон для очей */
            --crm-bg: #eef2f6;
            --crm-card-bg: #ffffff;
            --crm-border: #dbe2ea;
            --crm-border-subtle: #cbd5e1;
            --crm-primary: #007a33;
            --crm-primary-hover: #006329;
            --crm-header-red: #dc2626;
            --crm-text-main: #1e293b;
            --crm-text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--crm-bg);
            color: var(--crm-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Червона верхня навігаційна панель */
        .navbar-custom {
            background-color: var(--crm-header-red);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        /* Збільшений білий логотип */
        .brand-logo-white {
            height: 38px;
            width: auto;
            filter: brightness(0) invert(1);
            display: inline-block;
        }

        /* Картки та панелі */
        .card {
            background: var(--crm-card-bg);
            border: 1px solid var(--crm-border);
            border-radius: 12px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        .card-header {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--crm-border);
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
        }

        /* Кнопки */
        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn-brand {
            background-color: var(--crm-primary);
            color: #ffffff;
            border: none;
        }
        .btn-brand:hover {
            background-color: var(--crm-primary-hover);
            color: #ffffff;
        }

        .btn-header-exit {
            background-color: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        .btn-header-exit:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Таблиці */
        .table {
            --bs-table-bg: transparent;
            color: var(--crm-text-main);
        }
        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.74rem;
            letter-spacing: 0.05em;
            color: var(--crm-text-muted);
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--crm-border);
            padding: 10px 8px;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f1f5f9;
        }

        /* Soft Badges */
        .badge-soft-success { background-color: #dcfce7; color: #15803d; }
        .badge-soft-warning { background-color: #fef9c3; color: #854d0e; }
        .badge-soft-danger { background-color: #fee2e2; color: #b91c1c; }
        .badge-soft-primary { background-color: #e0f2fe; color: #0369a1; }
        .badge-soft-secondary { background-color: #f1f5f9; color: #475569; }
        
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid var(--crm-border);
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--crm-primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 51, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2 px-4 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="/">
                <img src="/static/logotipnew.png" alt="MAYER PRO" class="brand-logo-white">
                <span class="badge bg-dark text-white text-uppercase ms-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">B2B CRM</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/logout" class="btn btn-sm btn-header-exit d-flex align-items-center gap-1 fw-semibold">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 pb-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
