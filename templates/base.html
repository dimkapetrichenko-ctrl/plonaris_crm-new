<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLONARIS | B2B CRM System</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* Гармонійна зелена гама */
            --crm-bg: #f2f7f4;
            --crm-card-bg: #ffffff;
            --crm-border: #d4e3d9;
            --crm-border-subtle: #cbd5e1;
            --crm-primary: #166534;
            --crm-primary-hover: #14532d;
            --crm-header-green: #14532d;
            --crm-accent-green: #22c55e;
            --crm-text-main: #0f172a;
            --crm-text-muted: #64748b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--crm-bg);
            color: var(--crm-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Зелена верхня навігаційна панель */
        .navbar-custom {
            background: linear-gradient(135deg, #14532d 0%, #166534 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 14px rgba(20, 83, 45, 0.25);
        }

        /* Логотип бренду */
        .brand-logo-img {
            height: 36px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            display: inline-block;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* Картки та панелі */
        .card {
            background: var(--crm-card-bg);
            border: 1px solid var(--crm-border);
            border-radius: 12px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .card-header {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--crm-border);
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
        }

        /* Кнопки */
        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn-brand {
            background-color: var(--crm-primary);
            color: #ffffff;
            border: none;
        }
        .btn-brand:hover {
            background-color: var(--crm-primary-hover);
            color: #ffffff;
        }

        .btn-header-exit {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-header-exit:hover {
            background-color: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Таблиці */
        .table {
            --bs-table-bg: transparent;
            color: var(--crm-text-main);
        }
        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.74rem;
            letter-spacing: 0.05em;
            color: var(--crm-text-muted);
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--crm-border);
            padding: 10px 8px;
        }
        .table tbody tr {
            transition: background-color 0.15s ease;
        }
        .table tbody tr:hover {
            background-color: #f0fdf4;
        }

        /* Soft Badges */
        .badge-soft-success { background-color: #dcfce7; color: #15803d; }
        .badge-soft-warning { background-color: #fef9c3; color: #854d0e; }
        .badge-soft-danger { background-color: #fee2e2; color: #b91c1c; }
        .badge-soft-primary { background-color: #e0f2fe; color: #0369a1; }
        .badge-soft-secondary { background-color: #f1f5f9; color: #475569; }
        
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid var(--crm-border);
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--crm-primary);
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.18);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2 px-4 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="/">
                <!-- Логотип компанії Plonaris -->
                <img src="/static/logo.png" alt="Plonaris Logo" class="brand-logo-img" onerror="this.style.display='none'; document.getElementById('default-brand-icon').style.display='flex';">
                
                <!-- Запасна векторна іконка, якщо logo.png ще не завантажено -->
                <span id="default-brand-icon" class="bg-white text-success rounded-circle p-1 align-items-center justify-content-center shadow-xs" style="width: 32px; height: 32px; display: none;">
                    <i class="bi bi-tree-fill fs-5"></i>
                </span>
                
                <span class="brand-title">PLONARIS</span>
                <span class="badge bg-success-subtle text-success text-uppercase ms-1 border border-success fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">B2B CRM</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/logout" class="btn btn-sm btn-header-exit d-flex align-items-center gap-1 fw-semibold">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 pb-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
