<svg id="svg-stage-6" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" style="color: rgb(255, 255, 255);">
              <defs>
                <style>
                  .c-cell-6 { font-family: 'League Spartan', sans-serif; font-size: 46px; font-weight: 800; fill: currentColor; text-anchor: middle; }
                  .c-box-6 { fill: none; stroke: currentColor; stroke-width: 4.5; }
                  .c-sub-6 { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.38em; text-anchor: middle; }
                  .c-gear-outline { fill: none; stroke: currentColor; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
                </style>
                
                <path id="tooth-outline-6" d="M -8.5,-48 L -5.5,-63 L 5.5,-63 L 8.5,-48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
                
                <mask id="gear-circle-mask">
                  <rect x="-100" y="-100" width="200" height="200" fill="white"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(45)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(90)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(135)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(180)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(225)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(270)"/>
                  <rect x="-9.5" y="-55" width="19" height="12" fill="black" transform="rotate(315)"/>
                </mask>

                <g id="outline-gear-model">
                  <circle cx="0" cy="0" r="48" fill="none" stroke="currentColor" stroke-width="4.5" mask="url(#gear-circle-mask)"/>
                  <circle cx="0" cy="0" r="15" fill="none" stroke="currentColor" stroke-width="4.5"/>
                  <use href="#tooth-outline-6"/>
                  <use href="#tooth-outline-6" transform="rotate(45)"/>
                  <use href="#tooth-outline-6" transform="rotate(90)"/>
                  <use href="#tooth-outline-6" transform="rotate(135)"/>
                  <use href="#tooth-outline-6" transform="rotate(180)"/>
                  <use href="#tooth-outline-6" transform="rotate(225)"/>
                  <use href="#tooth-outline-6" transform="rotate(270)"/>
                  <use href="#tooth-outline-6" transform="rotate(315)"/>
                </g>

                <clipPath id="left-gear-clip">
                  <rect x="0" y="0" width="261" height="550"/>
                </clipPath>
                <clipPath id="right-gear-clip">
                  <rect x="539" y="0" width="261" height="550"/>
                </clipPath>
              </defs>

              <rect width="100%" height="100%" fill="rgb(45, 127, 53)"/>

              <g id="split-gears">
                <g clip-path="url(#left-gear-clip)">
                  <use href="#outline-gear-model" x="261" y="280"/>
                </g>
                <g clip-path="url(#right-gear-clip)">
                  <use href="#outline-gear-model" x="539" y="280"/>
                </g>
              </g>

              <g id="letters-grid">
                <rect x="271" y="217" width="60" height="60" rx="6" class="c-box-6"/><text x="301" y="261" class="c-cell-6">P</text>
                <rect x="337" y="217" width="60" height="60" rx="6" class="c-box-6"/><text x="367" y="261" class="c-cell-6">L</text>
                <rect x="403" y="217" width="60" height="60" rx="6" class="c-box-6"/><text x="433" y="261" class="c-cell-6">O</text>
                <rect x="469" y="217" width="60" height="60" rx="6" class="c-box-6"/><text x="499" y="261" class="c-cell-6">N</text>
                <rect x="271" y="283" width="60" height="60" rx="6" class="c-box-6"/><text x="301" y="327" class="c-cell-6">A</text>
                <rect x="337" y="283" width="60" height="60" rx="6" class="c-box-6"/><text x="367" y="327" class="c-cell-6">R</text>
                <rect x="403" y="283" width="60" height="60" rx="6" class="c-box-6"/><text x="433" y="327" class="c-cell-6">I</text>
                <rect x="469" y="283" width="60" height="60" rx="6" class="c-box-6"/><text x="499" y="327" class="c-cell-6">S</text>
              </g>

              <g id="brand-subtitle-group">
                <text x="400" y="372" fill="currentColor" class="c-sub-6">AGRO CZĘŚCI</text>
              </g>
            </svg>
